# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz
    use_sim_time: true

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # joint_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    # 
    allow_nonzero_velocity_at_trajectory_end: false
    
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0
      joint1:
        trajectory: 0.1
        goal: 0.05
      joint2:
        trajectory: 0.1
        goal: 0.05
      joint3:
        trajectory: 0.1
        goal: 0.05
      joint4:
        trajectory: 0.1
        goal: 0.05
      joint5:
        trajectory: 0.1
        goal: 0.05
hand_controller:
  ros__parameters:
    joint: finger_joint1
    # 
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 1.0
    allow_stalling: false
     # 
    min_position: -1.5708
    max_position: 0.0
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
