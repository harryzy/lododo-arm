# Dual-view triangulation configuration parameters
# ROS2 parameter file format
# Used for TriangulationNode, ProjectionNode, ArmCommandInterface

# Global shared parameters (/** means all nodes can access)
/**:
  ros__parameters:
    # 🎯 DATA-DRIVEN CAMERA CALIBRATION (2025-11-12)
    # These parameters override TF transform to achieve sub-cm accuracy
    # Calibrated from: Object at X=0.31m, Y=0.0m, Z=0.025m (base_link frame)
    # Method: Reverse engineering from ground truth measurements
    # ⚠️  Hardware-dependent: Re-calibrate if camera mount changes!
    use_calibrated_camera_params: true  # Use data-driven calibration (true) or ROS TF (false)
    calibrated_pitch_angle: 97.75       # Camera pitch angle (degrees) - reverse engineered
    calibrated_translation_x: -0.2745   # Camera to base_link X (meters)
    calibrated_translation_y: -0.0080   # Camera to base_link Y (meters)
    calibrated_translation_z: 0.1055    # Camera to base_link Z (meters)
    # 📊 Calibration accuracy: 0.00mm error at calibration point (X=0.31m, Y=0.0m, Z=0.025m)
    
    # 🎯 Dual-view baseline parameter (GLOBAL - used by all nodes)
    # This parameter defines the joint1 rotation angle for dual-view triangulation
    # baseline=0.15 → joint1 rotates 15 degrees (converted via baseline×100)
    # baseline=0.20 → joint1 rotates 20 degrees
    # 
    # Used by:
    # - triangulation_node: Calculate effective baseline and triangulation
    # - arm_command_interface: Control arm joint1 rotation angle
    # 
    # 🔧 Adjustment guide:
    # - Larger angle → Better depth accuracy at far distances, but slower scanning
    # - Smaller angle → Faster scanning, but limited far-distance measurement
    # - Recommended range: 0.15~0.25 (15°~25°)
    baseline: 0.15              # Dual-view rotation angle parameter (dimensionless, multiply by 100 to get degrees)
                                 # ✅ CALIBRATED: 0.15 (15°) - optimal balance for detection reliability
    
    # Position correction parameters (shared by triangulation_node and projection_node)
    # 🎯 MANUAL FINE-TUNING (for hardware offsets not captured by calibration)
    # With data-driven camera calibration, the algorithm should be accurate (<1cm error)
    # These parameters allow users to compensate for:
    #   - Gripper offset from camera optical center
    #   - Systematic hardware installation errors
    #   - Fine-tuning for specific grasp requirements
    # 
    position_correction_x: 0.0     # X offset (meters) - add if gripper is offset in X direction
    position_correction_y: 0.0     # Y offset (meters) - add if gripper is offset in Y direction
    position_correction_z: 0.03     # Z offset (meters) - add if gripper is offset in Z direction
    
    # 💡 How to use:
    # 1. Test with data-driven calibration (current settings with all zeros)
    # 2. If grasp position needs adjustment, modify these values
    # 3. Example: If gripper consistently misses by 2cm in X, set position_correction_x: 0.02
    
    # 🎲 Cube detection mode (shared by triangulation_node, overridable by launch script)
    detect_cube_only: false     # Whether to detect only cubes (true=only grasp cubes)
    cube_aspect_ratio_tolerance: 0.3   # bbox aspect ratio tolerance
    cube_dimension_tolerance: 0.25     # 3D dimension tolerance
    
    # ⏱️ Dual-view timeout parameter (GLOBAL)
    dual_view_timeout: 20.0     # Detection timeout for each view (seconds)

# TriangulationNode parameters
triangulation_node:
  ros__parameters:
    # Camera intrinsics (automatically read from camera_info, here as backup)
    camera_fx: 1128.1
    camera_fy: 1128.1
    camera_cx: 320.0
    camera_cy: 240.0
    
    # Triangulation parameters
    # Note: baseline parameter moved to global section (/** above)
    # The baseline value is now shared across all nodes to avoid inconsistency
    camera_radius: 0.33         # 📐 Physical measurement: Camera optical center to joint1 axis distance (meters)
                                 # Measurement method: Use ruler to measure horizontal distance from camera lens center to joint1 rotation axis
                                 # Used for: baseline_effective calculation for triangulation
                                 # Adjustment: Only when mechanical structure changes (e.g., camera mount relocated)
    depth_calibration_factor: 1.03  # 📊 CALIBRATED (2025-11-12): For baseline=0.15 (15°)
                                     # ✅ FIXED: Now scales entire 3D position (X/Y/Z uniformly)
                                     # Previous bug: Only scaled Z, causing distance-dependent errors
                                     # Test history: 0.80→1.03 (accurate at baseline=0.15)
                                     # Formula: actual_depth = raw_depth × this_factor
                                     # Impact: Adjusting this value maintains accuracy across all distances
    min_disparity: 3.0         # Minimum disparity (pixels)
    max_depth: 2.0              # Maximum measurement depth (meters)
    min_depth: 0.10             # Minimum measurement depth (meters)
    iou_threshold: 0.15          # Object matching IoU threshold
    pixel_uncertainty: 1.0      # Pixel uncertainty
    
    # Matching threshold when classes differ
    class_mismatch_score_threshold: 0.20  # Minimum matching score when classes differ (default 0.5 too high)
    same_class_score_threshold: 0.40      # Minimum matching score when classes are same
    min_detection_confidence: 0.40        # 🎯 NEW: Minimum detection confidence for triangulation
                                          # Filters out low-confidence detections before triangulation
                                          # Default 0.40 ensures only reliable detections are used
                                          # In your case: cake(0.265), umbrella(0.231) would be filtered out
    
    # Thickness estimation parameters (for reverse-calculating 3D size from oblique view)
    # Formula: thickness = width × thickness_ratio
    # Different object classes can have different ratios
    thickness_ratio_default: 1.0  # Default thickness ratio (generic objects)
    
    # Object class-specific thickness ratios (COCO dataset class IDs)
    # Parameter naming format: thickness_ratio_class_{class_id}
    thickness_ratio_class_39: 0.3   # bottle (beverage bottle): elongated
    thickness_ratio_class_40: 0.4   # wine glass: elongated
    thickness_ratio_class_41: 0.5   # cup: medium
    thickness_ratio_class_45: 0.6   # bowl: thicker
    thickness_ratio_class_56: 0.2   # chair: thin
    thickness_ratio_class_60: 0.1   # dining table: very thin
    thickness_ratio_class_63: 0.15  # laptop: thin
    thickness_ratio_class_64: 0.6   # mouse: thicker
    thickness_ratio_class_66: 0.25  # keyboard: thin
    thickness_ratio_class_73: 0.08  # book: very thin
    thickness_ratio_class_75: 0.4   # vase: medium
    # Note: Upright elongated objects like toothbrush (79) will automatically use upright object algorithm (aspect_ratio>2.5)

    # Node switches
    enable_triangulation: true  # Enabled by default
    
    cube_min_edge_length: 0.03  # Cube minimum edge length (meters) = 3cm
    cube_max_edge_length: 0.08  # Cube maximum edge length (meters) = 8cm
    cube_max_x_position: 0.5    # Cube maximum X coordinate (meters) - exceeds arm working range

# Note: ArmCommandInterface parameters section removed
# All parameters (baseline, dual_view_timeout) are now in global section (/** above)
# ArmCommandInterface will read them directly from global parameters
