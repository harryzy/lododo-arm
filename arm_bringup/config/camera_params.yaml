# USB camera parameter configuration
# Used to improve recognition of objects with different colors
# 
# Problem: Dark objects (mouse) recognized well, light objects (tissue) difficult to recognize
# Cause: Light objects easily overexposed in bright environment, features not obvious
#
# Adjustment suggestions:
# - Reduce brightness and exposure to avoid overexposure
# - Increase contrast to enhance edge contrast
# - Increase sharpness to strengthen object contour

camera:
  usb_cam:
    ros__parameters:
      # Basic parameters
      video_device: "/dev/video0"
      image_width: 640
      image_height: 480
      framerate: 30.0
      pixel_format: "yuyv"
      
      # 🎨 Image quality parameters (improve recognition)
      brightness: 30          # Brightness (0-255, default 128)
                              # Recommended: 50-80 to avoid overexposure of light objects
                              
      contrast: 50            # Contrast (0-255, default 32)
                              # Recommended: 35-50 to enhance object edges

      saturation: 60          # Saturation (0-255, default 64)
                              # Recommended: 60-70 to maintain color accuracy
                              
      sharpness: 6            # Sharpness (0-255, default 3)
                              # Recommended: 4-6 to strengthen object contour
      
      # 📷 Exposure control (key parameter)
      auto_exposure: 1        # Auto exposure mode
                              # 1 = Manual Mode (manual, recommended)
                              # 3 = Aperture Priority Mode (aperture priority, auto)
                              
      exposure: 50           # Exposure value (1-5000, default 156)
                              # Recommended: 80-120 to reduce overexposure
                              # If light objects still too bright, further reduce to 60-80
                              
      # 🎯 White balance (affects color accuracy)
      auto_white_balance: true  # Auto white balance (recommended enabled)
      white_balance: 4000       # White balance temperature (only when auto=false)
      
      # Other parameters
      frame_id: "camera_link"
      io_method: "mmap"
      camera_info_url: "package://arm_bringup/config/camera_info.yaml"

# 📝 Debugging steps:
# 1. Restart camera node to observe effect
# 2. If light objects still too bright:
#    - Reduce brightness to 30-40
#    - Reduce exposure to 60-80
# 3. If image too dark:
#    - Increase brightness to 70-90
#    - Increase exposure to 130-160
# 4. If edges not clear:
#    - Increase contrast to 45-55
#    - Increase sharpness to 6-8

# 🔍 Recommended configuration for different scenarios:
#
# Bright environment (office daytime):
#   brightness: 40, exposure: 80, contrast: 45
#
# Normal environment:
#   brightness: 50, exposure: 100, contrast: 40
#
# Low light environment:
#   brightness: 70, exposure: 150, contrast: 35
